<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boy's Pit Wall</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="topbar">

        <div class="eventInfo">

            <h1 id="eventName">
                Formula 1
            </h1>

            <div id="sessionTitle">
                Loading...
            </div>

        </div>

        <div class="statusInfo">

            <div id="raceStatus">
                Verbinden...
            </div>

            <div id="lastUpdate">
                -
            </div>

        </div>

    </header>

            <section class="panel">

    <h2>Volgende sessie</h2>

    <div class="infoRow">
        <span>Sessie</span>
        <span id="nextSessionName">-</span>
    </div>

    <div class="infoRow">
        <span>Lokale start</span>
        <span id="nextSessionTime">-</span>
    </div>

    <div class="countdownContainer">
        <div id="countdown">
            --:--:--
        </div>
    </div>

</section>

    <main class="dashboard">

        <section class="panel">

            <h2>Timing</h2>

            <div id="driverList"></div>

        </section>

        <section class="panel">

            <h2>Sessie</h2>

            <div class="infoRow">
                <span>Session</span>
                <span id="sessionName">-</span>
            </div>

            <div class="infoRow">
                <span>Circuit</span>
                <span id="circuitName">-</span>
            </div>

            <div class="infoRow">
                <span>Land</span>
                <span id="countryName">-</span>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
